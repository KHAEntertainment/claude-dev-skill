# Drop this file into any repo. All logic lives in the shared workflow.
# Needs one repo secret: MINIMAX_API_KEY (your MiniMax Token Plan key).
name: AI review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review with PR-Agent now"
        required: true

jobs:
  pr-agent:
    # Comment triggers: only the repo owner's /commands or CodeRabbit's
    # rate-limit notice may reach the shared workflow and its secret.
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.comment.user.login == 'coderabbitai[bot]' ||
      github.event.comment.author_association == 'OWNER'
    # Pinned to a reviewed commit (review-workflows 4c165c9, 2026-09-29: owner-only
    # /commands, PR-Agent action and image pinned, fallback catches every
    # CodeRabbit notice and runs once per head commit) because the called
    # workflow receives MINIMAX_API_KEY. Bump deliberately after review.
    uses: KHAEntertainment/review-workflows/.github/workflows/pr-agent.yml@4c165c96c34190ad3892aca9e2365e4422dbce79
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
